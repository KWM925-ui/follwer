human_follow_offboard_gate:
  input_setpoint_topic: /follow/offboard/setpoint
  output_setpoint_topic: /mavros/setpoint_raw/local
  command_topic: /follow/control/cmd_body
  mavros_state_topic: /mavros/state
  estimator_status_topic: /mavros/estimator_status
