source_frame: camera_optical_frame
target_frame: base_link
# Canonical Stage1 F450 baseline before real camera-body calibration is finished.
# Replace this with measured hardware extrinsics for the real aircraft path.
translation_xyz_m: [0.20, 0.00, 0.05]
# Example optical-frame-to-body transform:
# body.x = camera.z
# body.y = -camera.x
# body.z = -camera.y
transform_matrix_rowmajor:
  [
    0.0, 0.0, 1.0, 0.20,
    -1.0, 0.0, 0.0, 0.00,
    0.0, -1.0, 0.0, 0.05,
    0.0, 0.0, 0.0, 1.0
  ]
